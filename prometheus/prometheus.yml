global:
  scrape_interval: 5s
  evaluation_interval: 10s

scrape_configs:
  - job_name: myapp
    static_configs:
      - targets: ["backend:3001"]
  - job_name: myapp_db
    static_configs:
      - targets: ["pg_exporter:9187"]
  - job_name: myapp_node
    static_configs:
      - targets: ["node_exporter:9100"]
