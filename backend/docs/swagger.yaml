        type: array
      nama:
        type: string
      public_id:
        type: string
      role:
        $ref: '#/definitions/enum.PengawasRole'
    type: object
  dto.PengawasCreate:
    properties:
      nama:
        type: string
      password:
        type: string
      role:
        $ref: '#/definitions/enum.PengawasRole'
    type: object
  dto.TelemetryBase:
    properties:
      acc_x:
        type: number
      acc_y:
        type: number
      acc_z:
        type: number
      created_at:
        type: string
      gyro_x:
        type: number
      gyro_y:
        type: number
      gyro_z:
        type: number
      latitude:
        type: number
      longitude:
        type: number
      pitch:
        type: number
      public_id:
        type: string
      roll:
        type: number
      yaw:
        type: number
    type: object
  dto.TelemetryCreate:
    properties:
      acc_x:
        type: number
      acc_y:
        type: number
      acc_z:
        type: number
      gyro_x:
        type: number
      gyro_y:
        type: number
      gyro_z:
        type: number
      latitude:
        type: number
      longitude:
        type: number
      pitch:
        type: number
      roll:
        type: number
      yaw:
        type: number
    type: object
  enum.JenisAlert:
    enum:
    - Jatuh
    - Postur Tubuh
    - Cuaca Ekstrem
    type: string
    x-enum-varnames:
    - Jatuh
    - Postur
    - Cuaca
  enum.PengawasRole:
    enum:
    - Admin
    - Pengawas
    type: string
    x-enum-varnames:
    - Admin
    - Pengawas
  enum.TingkatKeparahan:
    enum:
    - Tinggi
    - Menengah
    - Rendah
    type: string
    x-enum-varnames:
    - Tinggi
    - Menengah
    - Rendah
