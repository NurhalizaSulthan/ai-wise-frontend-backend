          $ref: '#/definitions/dto.TelemetryBase'
        type: array
    type: object
  dto.DeviceCreate:
    properties:
      pekerja_public_id:
        type: string
    type: object
  dto.LoginUser:
    properties:
      nama:
        type: string
      password:
        type: string
    type: object
  dto.PekerjaBase:
    properties:
      device:
        $ref: '#/definitions/dto.DeviceBase'
      jenis_kelamin:
        type: string
      nama:
        type: string
      pengawas_id:
        type: integer
      public_id:
        type: string
      tanggal_lahir:
        type: string
    type: object
  dto.PekerjaCreate:
    properties:
      device_public_id:
        description: PengawasPublicID uuid.UUID `json:"pengawas_public_id"`
