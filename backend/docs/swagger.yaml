    properties:
      error:
        example: Invalid request
        type: string
      message:
        example: Gagal parsing request
        type: string
      status:
        example: 400 Bad Request
        type: string
      status_code:
        example: 400
        type: integer
    type: object
  response.CreationSuccessResponse:
    properties:
      data: {}
      message:
