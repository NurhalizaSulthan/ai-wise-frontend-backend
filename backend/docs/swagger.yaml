        type: string
      status:
        example: 201 Created
        type: string
      status_code:
        example: 201
        type: integer
    type: object
  response.InternalErrorResponse:
    properties:
      error:
        example: Internal server error
        type: string
      message:
        example: Kesalahan pada sisi server
        type: string
      status:
        example: 500 Internal Server Error
        type: string
      status_code:
        example: 500
        type: integer
    type: object
  response.SuccessResponse:
    properties:
      data: {}
      message:
        example: Request berhasil
        type: string
      status:
        example: 200 OK
        type: string
      status_code:
        example: 200
        type: integer
    type: object
  response.UnauthorizedResponse:
